name: Update README stats cards

on:
  schedule:
    - cron: "23 4 * * *" # every day
  push:
    paths:
      - ".github/workflows/readme-cards.yml"
  workflow_dispatch:

# STATS_TOKEN: a PAT with read access to private repos, so private commits and PRs
# count. Without it the job falls back to GITHUB_TOKEN (public repos only).
permissions:
  contents: write

env:
  # Black background in both GitHub themes, so the colours keep their contrast.
  THEME: disable_animations=true&hide_border=true&bg_color=000000&title_color=7fd1aa&icon_color=7fd1aa&text_color=e4e9e4

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars,issues,contribs&show=reviews,prs_merged&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          # Commit as the profile owner, not as github-actions[bot].
          git config user.name "Tomáš Vlasák"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
